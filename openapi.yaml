openapi: 3.0.3
info:
  title: FarmConnect API
  version: 1.0.0
  description: Versioned API for the FarmConnect produce-contract marketplace.
servers:
  - url: https://farmconnect.3bs.ltd/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: API health check
      responses:
        '200':
          description: Service is available
  /auth/register:
    post:
      security: []
      summary: Register a buyer or farmer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and mobile access token created
  /auth/login:
    post:
      security: []
      summary: Sign in and receive a mobile access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated account
  /auth/oidc/start:
    get:
      security: []
      summary: Start Auth0 OpenID Connect sign-in
      responses:
        '302':
          description: Redirect to Auth0
        '503':
          description: Auth0 is not configured
  /auth/oidc/callback:
    get:
      security: []
      summary: Complete Auth0 OpenID Connect sign-in
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the FarmConnect workspace
        '400':
          description: Invalid or expired OIDC response
        '409':
          description: Existing email requires explicit account linking
  /auth/me:
    get:
      summary: Get the current account
      responses:
        '200':
          description: Current user
  /auth/logout:
    post:
      summary: End the web session
      responses:
        '200':
          description: Session ended
  /demands:
    get:
      security: []
      summary: List open and contracted demands
      responses:
        '200':
          description: Demand collection
    post:
      summary: Create a buyer demand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandRequest'
      responses:
        '201':
          description: Demand created
  /demands/{demandId}/offers:
    parameters:
      - $ref: '#/components/parameters/DemandId'
    get:
      summary: List offers for a buyer-owned demand
      responses:
        '200':
          description: Offer collection
    post:
      summary: Submit a farmer offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequest'
      responses:
        '201':
          description: Offer created
  /offers/{offerId}:
    parameters:
      - name: offerId
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Accept an offer and create a contract
      responses:
        '201':
          description: Contract created
  /contracts:
    get:
      summary: List contracts for the current account
      responses:
        '200':
          description: Contract collection
  /locations:
    get:
      security: []
      summary: List administrative locations
      parameters:
        - name: level
          in: query
          schema: { type: string, enum: [district, subcounty, parish, village] }
        - name: parent_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Location collection
  /nurseries:
    get:
      security: []
      summary: Discover verified nurseries
      parameters:
        - name: district
          in: query
          schema: { type: string }
        - name: subcounty
          in: query
          schema: { type: string }
        - name: parish
          in: query
          schema: { type: string }
        - name: village
          in: query
          schema: { type: string }
        - name: crop
          in: query
          schema: { type: string }
        - name: available
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Verified nursery collection
          content:
            application/json:
              schema:
                type: object
                required: [nurseries, stats, pagination]
                properties:
                  nurseries:
                    type: array
                    items:
                      $ref: '#/components/schemas/NurserySummary'
                  stats:
                    $ref: '#/components/schemas/NurseryStats'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /nurseries/{nurseryId}:
    get:
      security: []
      summary: Get a verified nursery profile and listings
      parameters:
        - name: nurseryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Nursery profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NurseryDetailResponse'
        '404':
          description: Nursery not found
  /organisations:
    post:
      summary: Create a supplier organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationRequest'
      responses:
        '201':
          description: Organisation created
  /organisations/{organisationId}/locations:
    post:
      summary: Add a supplier location
      parameters:
        - name: organisationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierLocationRequest'
      responses:
        '201':
          description: Supplier location created
  /nurseries/{nurseryId}/verification-submissions:
    post:
      summary: Submit a nursery for verification
      parameters:
        - name: nurseryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '201':
          description: Verification submitted
  /products:
    get:
      security: []
      summary: List active catalogue products and varieties
      responses:
        '200':
          description: Product collection
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierProduct'
  /supplier/locations:
    get:
      summary: List locations managed by the current supplier account
      responses:
        '200':
          description: Supplier location collection
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierLocation'
  /supplier/listings:
    get:
      summary: List listings managed by the current supplier account
      responses:
        '200':
          description: Supplier listing collection
          content:
            application/json:
              schema:
                type: object
                required: [listings]
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierListing'
  /admin/verification-submissions/{submissionId}/{decision}:
    post:
      summary: Approve or reject a nursery verification submission
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: { type: integer }
        - name: decision
          in: path
          required: true
          schema: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: Verification decision recorded
  /admin/verification-submissions:
    get:
      summary: List pending nursery verification submissions
      responses:
        '200':
          description: Pending verification submissions
          content:
            application/json:
              schema:
                type: object
                required: [submissions]
                properties:
                  submissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerificationSubmission'
  /admin/organisations:
    get:
      summary: List supplier organisations for platform administration
      responses:
        '200':
          description: Supplier organisation collection
          content:
            application/json:
              schema:
                type: object
                required: [organisations]
                properties:
                  organisations:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminOrganisation'
  /admin/organisations/{organisationId}/status:
    patch:
      summary: Suspend or reactivate a supplier organisation
      parameters:
        - name: organisationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Supplier organisation status updated
  /admin/organisations/{organisationId}/members/{userId}/status:
    patch:
      summary: Suspend or reactivate an organisation member
      parameters:
        - name: organisationId
          in: path
          required: true
          schema: { type: integer }
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Organisation member status updated
        '409':
          description: The organisation must retain an active owner
  /admin/listings:
    get:
      summary: List supplier listings for platform moderation
      responses:
        '200':
          description: Supplier listing collection
          content:
            application/json:
              schema:
                type: object
                required: [listings]
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminListing'
  /admin/listings/{listingId}/status:
    patch:
      summary: Change a supplier listing moderation status
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, published, paused, archived] }
      responses:
        '200':
          description: Supplier listing status updated
        '404':
          description: Supplier listing not found
  /listings:
    post:
      summary: Create a supplier product listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingRequest'
      responses:
        '201':
          description: Listing created
  /listings/{listingId}:
    patch:
      summary: Update a supplier listing
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingUpdateRequest'
      responses:
        '200':
          description: Listing updated
  /listings/{listingId}/inventory-movements:
    get:
      summary: List inventory movements for a supplier listing
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Inventory movement history
          content:
            application/json:
              schema:
                type: object
                required: [movements]
                properties:
                  movements:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryMovement'
    post:
      summary: Record a supplier stock movement
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryMovementRequest'
      responses:
        '200':
          description: Stock updated
  /orders:
    get:
      summary: List orders for the current account
      responses:
        '200':
          description: Order collection
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
    post:
      summary: Place a direct nursery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created and stock reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
  /orders/{orderId}/{decision}:
    post:
      summary: Confirm or reject a supplier order
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
        - name: decision
          in: path
          required: true
          schema: { type: string, enum: [confirm, reject] }
      responses:
        '200':
          description: Order decision recorded
  /orders/{orderId}/cancel:
    post:
      summary: Cancel a buyer-owned order before fulfilment
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Order cancelled and reserved stock released
  /orders/{orderId}/events:
    get:
      summary: List visible order state history
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Chronological order events
  /orders/{orderId}/status:
    post:
      summary: Advance an order through fulfilment or record receipt/dispute
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ready_for_collection, out_for_delivery, received, disputed]
      responses:
        '200':
          description: Order status advanced
  /quotation-requests:
    get:
      summary: List quotation requests for the current account
      responses:
        '200':
          description: Quotation request collection
    post:
      summary: Request a bulk procurement quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationRequest'
      responses:
        '201':
          description: Quotation request created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    DemandId:
      name: demandId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, maxLength: 160 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, format: password }
        role: { type: string, enum: [buyer, farmer] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    DemandRequest:
      type: object
      required: [crop, quantity, unit, target_price, location, delivery_date]
      properties:
        crop: { type: string, maxLength: 160 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, maxLength: 32 }
        target_price: { type: number, exclusiveMinimum: 0 }
        location: { type: string, maxLength: 160 }
        delivery_date: { type: string, format: date }
        notes: { type: string }
    OfferRequest:
      type: object
      required: [quantity, price]
      properties:
        quantity: { type: number, exclusiveMinimum: 0 }
        price: { type: number, exclusiveMinimum: 0 }
        note: { type: string }
    NurserySummary:
      type: object
      properties:
        id: { type: integer }
        nursery_name: { type: string }
        location_name: { type: string }
        administrative_location: { type: string, nullable: true }
        verification_status: { type: string, enum: [verified] }
        products: { type: string, nullable: true }
        order_listing_id: { type: integer, nullable: true, description: Published listing id used when placing a direct order }
        starting_price: { type: number, nullable: true }
        available_quantity: { type: number, nullable: true }
    NurseryStats:
      type: object
      required: [verified_nurseries, available_seedlings, location_levels]
      properties:
        verified_nurseries: { type: integer, minimum: 0 }
        available_seedlings: { type: number, minimum: 0 }
        location_levels: { type: integer, minimum: 0 }
    NurseryDetailResponse:
      type: object
      required: [nursery]
      properties:
        nursery:
          $ref: '#/components/schemas/NurseryDetail'
    NurseryDetail:
      type: object
      required: [id, nursery_name, location_name, verification_status, listings]
      properties:
        id: { type: integer }
        description: { type: string, nullable: true }
        operator_name: { type: string, nullable: true }
        whatsapp: { type: string, nullable: true }
        years_operating: { type: integer, nullable: true }
        verification_status: { type: string, enum: [verified] }
        nursery_name: { type: string }
        location_name: { type: string }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        administrative_location: { type: string, nullable: true }
        listings:
          type: array
          items:
            $ref: '#/components/schemas/NurseryListing'
    NurseryListing:
      type: object
      required: [id, product, price, currency, unit, available_quantity, minimum_quantity]
      properties:
        id: { type: integer }
        product: { type: string }
        variety: { type: string, nullable: true }
        price: { type: number, minimum: 0 }
        currency: { type: string }
        unit: { type: string }
        available_quantity: { type: number, minimum: 0 }
        minimum_quantity: { type: number, minimum: 0 }
    Pagination:
      type: object
      required: [limit, offset]
      properties:
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    OrderSummary:
      type: object
      required: [id, status, fulfilment_method, supplier, location_name, products, quantity, total, currency]
      properties:
        id: { type: integer }
        buyer_id: { type: integer }
        status: { type: string, enum: [pending_supplier, confirmed, rejected, ready_for_collection, out_for_delivery, received, cancelled, disputed] }
        fulfilment_method: { type: string, enum: [collection, delivery] }
        delivery_address: { type: string, nullable: true }
        supplier: { type: string }
        location_name: { type: string }
        buyer: { type: string }
        products: { type: string, nullable: true }
        quantity: { type: number, minimum: 0 }
        total: { type: number, minimum: 0 }
        currency: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
    OrderCreatedResponse:
      type: object
      required: [id, total, currency]
      properties:
        id: { type: integer }
        total: { type: number, minimum: 0 }
        currency: { type: string }
    Location:
      type: object
      properties:
        id: { type: integer }
        parent_id: { type: integer, nullable: true }
        level: { type: string, enum: [district, subcounty, parish, village] }
        name: { type: string }
    OrganisationRequest:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, maxLength: 200 }
        legal_name: { type: string, maxLength: 200 }
        type: { type: string, enum: [supplier, cooperative, institution, buyer_business, platform_partner] }
        phone: { type: string }
        email: { type: string, format: email }
    SupplierLocationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        location_id: { type: integer }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        phone: { type: string }
    VerificationRequest:
      type: object
      properties:
        notes: { type: string }
    VerificationSubmission:
      type: object
      required: [id, organisation_id, status, organisation_name, submitted_by]
      properties:
        id: { type: integer }
        organisation_id: { type: integer }
        supplier_location_id: { type: integer, nullable: true }
        nursery_id: { type: integer, nullable: true }
        status: { type: string, enum: [submitted, under_review] }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        organisation_name: { type: string }
        location_name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        operator_name: { type: string, nullable: true }
        whatsapp: { type: string, nullable: true }
        description: { type: string, nullable: true }
        years_operating: { type: integer, nullable: true }
        submitted_by: { type: integer }
        submitted_by_name: { type: string }
        submitted_by_email: { type: string, format: email }
    AdminOrganisation:
      type: object
      required: [id, type, display_name, legal_name, status]
      properties:
        id: { type: integer }
        type: { type: string }
        display_name: { type: string }
        legal_name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        status: { type: string, enum: [pending, active, suspended, archived] }
        created_at: { type: string, format: date-time }
        member_count: { type: integer }
        location_count: { type: integer }
        nursery_count: { type: integer }
        verified_nursery_count: { type: integer }
        listing_count: { type: integer }
        members:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganisationMember'
    AdminOrganisationMember:
      type: object
      required: [user_id, name, email, role, status]
      properties:
        user_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, manager, staff, viewer] }
        status: { type: string, enum: [invited, active, suspended] }
    AdminListing:
      type: object
      required: [id, status, product, organisation_id, organisation_name, supplier_location_id, location_name]
      properties:
        id: { type: integer }
        status: { type: string, enum: [draft, published, paused, archived] }
        price: { type: number }
        currency: { type: string }
        unit: { type: string }
        available_quantity: { type: number }
        minimum_quantity: { type: number }
        published_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
        product: { type: string }
        variety: { type: string, nullable: true }
        organisation_id: { type: integer }
        organisation_name: { type: string }
        supplier_location_id: { type: integer }
        location_name: { type: string }
    SupplierProduct:
      type: object
      required: [id, name, unit, varieties]
      properties:
        id: { type: integer }
        name: { type: string }
        unit: { type: string }
        varieties:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
    SupplierLocation:
      type: object
      required: [id, organisation_id, name, status, organisation_name]
      properties:
        id: { type: integer }
        organisation_id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [draft, active] }
        organisation_name: { type: string }
    SupplierListing:
      allOf:
        - $ref: '#/components/schemas/AdminListing'
        - type: object
          properties:
            product_id: { type: integer }
            variety_id: { type: integer, nullable: true }
    ListingRequest:
      type: object
      required: [supplier_location_id, product_id, price, unit]
      properties:
        supplier_location_id: { type: integer }
        product_id: { type: integer }
        variety_id: { type: integer, nullable: true }
        price: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, default: UGX }
        unit: { type: string, maxLength: 32 }
        available_quantity: { type: number, minimum: 0 }
        minimum_quantity: { type: number, exclusiveMinimum: 0 }
        status: { type: string, enum: [draft, published] }
    ListingUpdateRequest:
      type: object
      properties:
        price: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, maxLength: 32 }
        minimum_quantity: { type: number, exclusiveMinimum: 0 }
